<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="SNS横断投稿自動化基盤の構成図">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#78859a"/>
    </marker>
    <style>
      .jp { font-family: 'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif; }
      .mn { font-family: 'SFMono-Regular',Consolas,'Courier New',monospace; }
      .box { fill:#fff; stroke:#0d1b2e; stroke-width:1.6; }
      .box-a { fill:#fff; stroke:#bc3b1e; stroke-width:2.2; }
      .lbl { font-size:20px; letter-spacing:.14em; fill:#78859a; }
      .ttl { font-size:27px; font-weight:700; fill:#0d1b2e; }
      .sub { font-size:20px; fill:#465468; }
      .arw { stroke:#78859a; stroke-width:1.6; fill:none; marker-end:url(#ar); }
    </style>
  </defs>

  <text class="mn lbl" x="50"  y="80">DRAFTS</text>
  <text class="mn lbl" x="360" y="80">POLICY — 仕様の空白を自分で定義</text>
  <text class="mn lbl" x="850" y="80">OUTCOME</text>
  <line x1="50" y1="98" x2="280" y2="98" stroke="#d7dde4"/>
  <line x1="360" y1="98" x2="770" y2="98" stroke="#d7dde4"/>
  <line x1="850" y1="98" x2="1150" y2="98" stroke="#d7dde4"/>

  <!-- 入力 -->
  <rect class="box" x="50" y="150" width="230" height="240" rx="3"/>
  <text class="jp ttl" x="72" y="198" style="font-size:25px">3系統の下書き</text>
  <text class="jp sub" x="72" y="240">X 相当</text>
  <text class="jp sub" x="72" y="272">note 相当</text>
  <text class="jp sub" x="72" y="304">Threads 相当</text>
  <text class="jp sub" x="72" y="346" style="font-size:18px; fill:#bc3b1e">※ 投稿APIを持たない</text>
  <text class="jp sub" x="72" y="370" style="font-size:18px; fill:#bc3b1e">先を含む</text>

  <path class="arw" d="M282 270 L352 270"/>

  <!-- 判定 -->
  <rect class="box-a" x="360" y="150" width="410" height="106" rx="3"/>
  <text class="mn lbl" x="384" y="184" style="fill:#bc3b1e">CHECK 01</text>
  <text class="jp ttl" x="384" y="224" style="font-size:24px">投稿APIがあるか</text>

  <rect class="box-a" x="360" y="272" width="410" height="106" rx="3"/>
  <text class="mn lbl" x="384" y="306" style="fill:#bc3b1e">CHECK 02</text>
  <text class="jp ttl" x="384" y="346" style="font-size:24px">リスク表現を含むか</text>

  <rect class="box-a" x="360" y="394" width="410" height="106" rx="3"/>
  <text class="mn lbl" x="384" y="428" style="fill:#bc3b1e">CHECK 03</text>
  <text class="jp ttl" x="384" y="468" style="font-size:24px">台帳に公開済みの記録があるか</text>

  <path class="arw" d="M772 200 L842 200"/>
  <path class="arw" d="M772 322 L842 322"/>
  <path class="arw" d="M772 446 L842 446"/>

  <!-- 出口 -->
  <rect class="box" x="850" y="150" width="300" height="100" rx="3"/>
  <text class="jp ttl" x="874" y="196" style="font-size:25px">自動公開</text>
  <text class="jp sub" x="874" y="228">条件を満たしたものだけ</text>

  <rect class="box" x="850" y="272" width="300" height="100" rx="3"/>
  <text class="jp ttl" x="874" y="318" style="font-size:25px">承認キュー</text>
  <text class="jp sub" x="874" y="350">人が見てから出す</text>

  <rect class="box" x="850" y="394" width="300" height="100" rx="3"/>
  <text class="jp ttl" x="874" y="440" style="font-size:25px">手動キュー</text>
  <text class="jp sub" x="874" y="472" style="font-size:18px">機械にできない分を人へ渡す</text>

  <line x1="50" y1="560" x2="1150" y2="560" stroke="#d7dde4"/>
  <line x1="50" y1="556" x2="50" y2="565" stroke="#d7dde4"/>
  <line x1="1150" y1="556" x2="1150" y2="565" stroke="#d7dde4"/>
  <text class="mn lbl" x="50" y="596" style="font-size:19px">Python 3.9+ — 標準ライブラリのみ / 追加インストール不要</text>
  <text class="jp sub" x="50" y="628" style="font-size:19px; fill:#78859a">台帳（ledger）で冪等性を担保し、途中で落ちて再実行しても二重公開しない</text>
</svg>
