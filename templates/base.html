<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% block title %}{{ site.name }}｜{{ site.tagline }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ site.description }}{% endblock %}">
  <link rel="canonical" href="{{ site.url }}{% block canonical %}/{% endblock %}">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.name }}">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:url" content="{{ site.url }}{{ self.canonical() }}">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#313131">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800&family=Barlow:wght@500;600&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>
    /* 動きの可否と冒頭演出の段階を描画前に決める。
       data-load: 0=演出前 / 1=冒頭演出中 / 2=ヒーロー表示（motion.js が進める）
       冒頭演出はトップページで1セッションに1回。2回目以降と下層ページは最初から 2。
       動きを減らす設定の人には演出を出さない */
    (function () {
      var d = document.documentElement;
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var load = '2';
      if (!reduce) {
        d.classList.add('js-motion');
        try {
          if (location.pathname === '/' && !sessionStorage.getItem('tegg-opening')) {
            sessionStorage.setItem('tegg-opening', '1');
            load = '0';
            d.classList.add('js-opening');
          }
        } catch (e) {}
      }
      d.setAttribute('data-load', load);
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23313131'/><circle cx='16' cy='16' r='11' fill='none' stroke='%23c4c4c4' stroke-width='1'/><path d='M10.5 11.5h11M16 11.5v10' stroke='white' stroke-width='2.6' fill='none'/></svg>">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "name": "{{ site.name }}",
    "url": "{{ site.url }}",
    "description": "{{ site.description }}",
    "areaServed": "JP",
    "founder": { "@type": "Person", "name": "{{ site.owner }}", "jobTitle": "{{ site.role }}" },
    "knowsAbout": ["生成AI", "RAG", "業務システム開発", "業務自動化", "製造業DX"]
  }
  </script>
</head>
<body class="{% block body_class %}{% endblock %}">

<a class="skip" href="#main">本文へ移動</a>

{% block opening %}{% endblock %}

{% include '_partials/header.html' %}

{# 背景に固定で置く線の輪。motion.js が描く。動きを減らす設定では静止した輪を1回だけ描く #}
<canvas class="ring" aria-hidden="true"></canvas>

<main id="main">
  {% block content %}{% endblock %}
</main>

{% block cta %}{% include '_partials/cta.html' %}{% endblock %}
{% include '_partials/footer.html' %}

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"
        integrity="sha512-oJ8QbaQThQoJZ7oEv+29jfPM6CcP+zUxh3PKJs1vyOhx0UraUrE7PQgeItu3dOuCJyrzWpoYMsVjkkPEBzbUqw=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js"
        integrity="sha512-OaIE7ud4P04EhnBuhEcm0wQSceIxbi2pV03oBLS/+F6ampfxsnxcIxOp7H2eF9G7N0kEht0VAzOLG+dTLSo17Q=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="{{ url_for('static', filename='js/motion.js') }}"></script>
</body>
</html>
