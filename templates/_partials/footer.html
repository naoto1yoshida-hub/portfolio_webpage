<footer class="ftr" data-zone="black">
  <div class="ftr__inner">
    <nav class="ftr__nav" aria-label="フッターメニュー">
      <ul class="ftr__big">
        <li><a class="roll" href="{{ url_for('works_index') }}"><span>WORKS</span><span aria-hidden="true">WORKS</span></a></li>
        <li><a class="roll" href="{{ url_for('index') }}#services"><span>SERVICES</span><span aria-hidden="true">SERVICES</span></a></li>
        <li><a class="roll" href="{{ url_for('index') }}#profile"><span>PROFILE</span><span aria-hidden="true">PROFILE</span></a></li>
        <li><a class="roll" href="{{ url_for('index') }}#contact"><span>CONTACT</span><span aria-hidden="true">CONTACT</span></a></li>
      </ul>
      <ul class="ftr__small">
        {% for link in profile_links %}
        <li><a class="roll" href="{{ link.url }}" target="_blank" rel="noopener noreferrer"><span>{{ link.label }}</span><span aria-hidden="true">{{ link.label }}</span></a></li>
        {% endfor %}
      </ul>
    </nav>

    <div class="ftr__foot">
      <p class="ftr__tag">生成AI × 製造業。中小企業の業務改善を、実装まで。</p>
      <a class="ftr__top" href="#main">Back to top</a>
      <p class="ftr__copy">{{ site.name|upper }} &copy; 2026</p>
    </div>
  </div>
</footer>
