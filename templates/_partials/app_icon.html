{#
  アプリのアイコン（線画）。太陽型の実績図と詳細パネルで使う。
  色は currentColor。種類は data/works.py の ORBIT の icon。
#}
{% macro app_icon(kind) -%}
<svg class="app-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {%- if kind == 'drawing' %}
  {# 図面シート + 虫めがね #}
  <path d="M6 4h13l5 5v9"/><path d="M19 4v5h5"/><path d="M6 4v24h11"/>
  <path d="M10 11h6M10 15h8M10 19h4"/>
  <circle cx="22.5" cy="22.5" r="4"/><path d="M25.5 25.5 28 28"/>
  {%- elif kind == 'estimate' %}
  {# 見積書 + 円記号 #}
  <path d="M7 4h18v24H7z"/><path d="M11 9h10"/>
  <path d="m12.5 14 3.5 4.5 3.5-4.5"/><path d="M16 18.5V24"/><path d="M13 19.5h6M13 22h6"/>
  {%- elif kind == 'stock' %}
  {# 在庫の箱 + アラートのバッジ #}
  <path d="M3 13.5 13.5 8 24 13.5v11L13.5 30 3 24.5z"/><path d="M3 13.5 13.5 19 24 13.5"/>
  <path d="M13.5 19v11"/><path d="m8.3 10.8 10.5 5.5"/>
  <circle cx="24.5" cy="7.5" r="5.5"/><path d="M24.5 5v3"/><path d="M24.5 10.2v.1"/>
  {%- elif kind == 'voice' %}
  {# マイク + 音の広がり #}
  <rect x="12" y="4" width="8" height="14" rx="4"/>
  <path d="M8 15a8 8 0 0 0 16 0"/><path d="M16 23v5M12 28h8"/>
  <path d="M4 11v4M28 11v4"/>
  {%- elif kind == 'chat' %}
  {# 吹き出し + チェック（出典付きで答える） #}
  <path d="M5 6h22v15H14l-6 5v-5H5z"/><path d="m11 13.5 3 3 7-6"/>
  {%- elif kind == 'share' %}
  {# 1つの投稿を複数へ配る分岐 #}
  <circle cx="7" cy="16" r="3.5"/><circle cx="25" cy="7" r="3.5"/>
  <circle cx="25" cy="16" r="3.5"/><circle cx="25" cy="25" r="3.5"/>
  <path d="M10.5 16h11M9.8 13.9l12-5.3M9.8 18.1l12 5.3"/>
  {%- endif %}
</svg>
{%- endmacro %}
